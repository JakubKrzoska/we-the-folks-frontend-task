<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Gut Run</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="root">
      <main id="stage">
        <canvas id="game"></canvas>

        <section id="start-screen">
          <img id="headline" class="layer fades" src="assets/01_game/tut.png" alt="Bringe Poo durch den Darm ans Ziel." />
          <img id="gesture" class="gesture fades" src="assets/gesture.png" alt="tab to run" />
        </section>

        <section id="fail-card" class="endcard">
          <img class="layer" src="assets/02_endcard/fail/bubble.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac1.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac2.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac3.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac4.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac5.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/sad.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/hl.png" alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut." />
          <button class="endcard-button fail-cta js-clickout" type="button">
            <img src="assets/02_endcard/fail/cta.png" alt="Jetzt informieren!" />
          </button>
          <button id="replay" class="endcard-button replay" type="button">
            <img src="assets/02_endcard/fail/replay.png" alt="Nochmal spielen" />
          </button>
        </section>

        <section id="win-card" class="endcard">
          <img class="layer" src="assets/02_endcard/win/bubble.png" alt="" />
          <img class="layer" src="assets/02_endcard/win/konfetti.png" alt="" />
          <img class="layer" src="assets/02_endcard/win/happy.png" alt="" />
          <img class="layer" src="assets/02_endcard/win/hl.png" alt="Poo, tut das gut! Wenn du weißt, was dein Darm braucht." />
          <button class="endcard-button win-cta js-clickout" type="button">
            <img src="assets/02_endcard/win/cta.png" alt="Jetzt mehr erfahren" />
          </button>
        </section>

        <img class="layer logo" src="assets/logo.png" alt="Your logo" />

        <button id="mute" class="mute" type="button" aria-label="Ton aus" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="speaker" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" />
            <path class="waves" d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" />
            <path class="slash" d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
          </svg>
        </button>
      </main>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
